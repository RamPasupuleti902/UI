<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eSIM Demo – Country Themed</title>
<style>
:root{--a:#2d7bd0;--b:#7b61ff;--ink:#14182b;--mut:#5d6580;--card:rgba(255,255,255,.9);--flag:none;--ov:.0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#14182b}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#eef2fb;min-height:100vh}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;animation:fade .6s}
#bg::before{content:"";display:none;position:absolute;inset:-10%;background:var(--flag) center/cover;filter:blur(36px) saturate(1.5);opacity:.8;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.05) translate(-2%,-1%)}to{transform:scale(1.2) translate(2%,2%)}}
#bg::after{content:"";display:none;position:absolute;inset:0;background:radial-gradient(circle at 12% 8%,color-mix(in srgb,var(--pa,transparent) 45%,transparent),transparent 45%),radial-gradient(circle at 90% 85%,color-mix(in srgb,var(--pb,transparent) 45%,transparent),transparent 50%),radial-gradient(rgba(255,255,255,0) 1.5px,transparent 2px) 0 0/26px 26px,linear-gradient(rgba(255,255,255,var(--ov)),rgba(255,255,255,var(--ov)))}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:3px solid var(--a)}
.logo{font-weight:800;letter-spacing:.2em;font-size:20px;cursor:pointer;color:var(--a)}
select{padding:8px 12px;border-radius:10px;border:1px solid var(--a);background:#fff;font:inherit;max-width:50vw}
main{max-width:1060px;margin:0 auto;padding:24px 16px 60px;animation:rise .5s}
h1{margin:0 0 6px}.sub{color:var(--mut);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cc{border:2px solid rgba(0,0,0,.06);border-radius:16px;padding:22px 10px;text-align:center;cursor:pointer;background:linear-gradient(rgba(255,255,255,.82),rgba(255,255,255,.82)),var(--f) center/cover;transition:.25s}
.cc:hover{transform:translateY(-5px);border-color:var(--c);box-shadow:0 12px 26px rgba(0,0,0,.18)}
.cc:hover{background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)),var(--f) center/cover}
.fl{width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:0 2px 8px rgba(0,0,0,.25);margin-bottom:8px;display:block;margin-inline:auto}
.cc b{display:block}.cc small{color:var(--mut)}
.hero{position:relative;overflow:hidden;min-height:340px;border-radius:22px;padding:26px;margin-bottom:16px;background:linear-gradient(180deg,#7fbdf0 0%,#cfe6f9 55%,#fff 100%);border:1px solid #cfe0f3}
.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(transparent,#fff)}
.art{position:absolute;right:0;bottom:0;height:100%;width:70%}.art svg{width:100%;height:100%}
.art img{position:absolute;right:0;bottom:0;height:100%;width:auto;max-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%);mask-image:linear-gradient(90deg,transparent,#000 10%)}
.wf{position:absolute;right:-30px;bottom:50px;width:210px;height:130px;background:var(--f) center/cover;transform:perspective(500px) rotateY(-30deg) rotate(-8deg);box-shadow:0 8px 20px rgba(0,0,0,.3);border-radius:4px;overflow:hidden}
.wf::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 20px,rgba(255,255,255,.16) 20px 40px);animation:wv 2.4s linear infinite}
@keyframes wv{to{background-position:40px 0}}
.hl{position:relative;z-index:2;max-width:55%}
.tt{display:flex;align-items:center;gap:14px;margin-bottom:12px}.tt h1{margin:0}
.sc{position:absolute;z-index:3;top:20px;right:20px;width:260px;background:rgba(255,255,255,.92);padding:14px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.sc select{width:100%;max-width:none;margin:4px 0 8px}.sc small{display:block;font-size:11px;font-weight:700;color:var(--mut)}
.cmp{background:#fff;border:1px solid #dbe4f3;border-radius:16px;padding:16px;text-align:center;font-weight:600;margin-bottom:16px}
@media(max-width:800px){.hl{max-width:100%}.sc{position:relative;top:0;right:0;width:100%;margin-top:14px}.art{opacity:.45;width:100%}}
.hero .fl{width:60px;height:60px;margin:0}
.hero h1 span{color:var(--a)}
.pill{display:inline-block;font-size:12px;padding:5px 11px;border-radius:99px;background:#fff;border:1px solid var(--b);margin:4px 6px 0 0}
.back{background:none;border:0;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;margin-bottom:12px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.8)}
.tabs{display:inline-flex;background:var(--card);border:2px solid var(--a);border-radius:14px;padding:5px;margin:6px 0 16px}
.tabs button{border:0;background:none;padding:10px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;color:var(--mut)}
.tabs .on{background:linear-gradient(90deg,var(--a),var(--b));color:#fff}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pc{position:relative;border-radius:16px;padding:26px 16px 16px;border:2px solid var(--a);background:#fff;transition:.25s;animation:rise .5s backwards}
.pc:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(0,0,0,.2)}
.tag{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,var(--a),var(--b));color:#fff;font-size:11px;font-weight:700;padding:4px 14px;border-radius:7px;white-space:nowrap}
.pc h3{margin:0;font-size:22px;color:var(--ink)}.pc .d{color:var(--mut);font-size:13px}
.pr{font-size:22px;font-weight:800;margin:8px 0}
.buy{width:100%;border:0;padding:10px;border-radius:10px;color:#fff;font:inherit;font-weight:700;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b))}
.wide{background:var(--card);border:2px dashed var(--b);padding:18px;border-radius:16px;display:flex;flex-direction:column;justify-content:center;gap:8px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:9}
</style></head><body>

<script>

function go(id){location.hash=id?'/'+id:'/';}
function theme(c){
  if(c){root.style.setProperty('--pa',c[3]);root.style.setProperty('--pb',c[4]);root.style.setProperty('--flag',uri(c[0]));root.style.setProperty('--ov','.25');}
  else{['--pa','--pb','--flag','--ov'].forEach(k=>root.style.removeProperty(k));}

}
